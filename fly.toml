# Fly.io configuration. The README describes the deployment.
app = "cdpp"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# The database. A new volume gets the data in db_dumps/cdpp.sql.
[mounts]
  source = "cdpp_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 60

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# The file server of the machine sends the photographs from the image. These
# requests do not go to the application, so they do not need the password.
[[statics]]
  guest_path = "/app/media/instance"
  url_prefix = "/media/instance"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
