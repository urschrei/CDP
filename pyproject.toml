[project]
name = "cdpp"
version = "0.3.0"
description = "Cuneiform Digital Palaeography Project"
readme = "README.md"
authors = [{ name = "Stephan Hügel", email = "urschrei@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "meilisearch>=0.43.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
cdpp = "cdpp.cli:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
# nbformat 3 notebooks from the original data import: ruff cannot parse them.
extend-exclude = ["utils/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Sign names use the multiplication sign, as in |NINDA₂×GUD|. Pages show
# primes in line and column numbers, as in 3′.
allowed-confusables = ["×", "′"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
